name: PLTR SPCX 3R Quant Tournament

on:
  push:
    branches:
      - quant-tournament-20260812
    paths:
      - quant_tournament.py
      - .github/workflows/quant-tournament.yml

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check pandas numpy requests pyarrow
      - name: Run tournament
        run: python quant_tournament.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pltr-spcx-3r-tournament
          path: |
            quant_results/FINAL_TOURNAMENT.csv
            quant_results/summary.json
          if-no-files-found: warn
