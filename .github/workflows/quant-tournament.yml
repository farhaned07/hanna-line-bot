name: PLTR SPCX 3R Quant Tournament Round 2

on:
  push:
    branches:
      - quant-tournament-r2-20260813
    paths:
      - quant_tournament_round2.py
      - quant_tournament_round2_fast.py
      - .github/workflows/quant-tournament.yml

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check pandas numpy requests pyarrow
      - name: Run tournament round 2
        run: python quant_tournament_round2_fast.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pltr-spcx-3r-tournament-round2
          path: |
            quant_results_round2/ROUND2_TOURNAMENT.csv
            quant_results_round2/ROUND2_FOLDS.csv
            quant_results_round2/summary_round2.json
          if-no-files-found: warn
